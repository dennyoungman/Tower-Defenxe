<!doctype html><html><head><meta charset="UTF-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0d1510"><title>Chronicle Defence — Battle</title><link rel="stylesheet" href="ottoman-battle.css?v=4"></head><body><div id="rotate"><b>↻</b><strong>TURN TO LANDSCAPE</strong></div><main><header><div><small>CHRONICLE DEFENCE</small><h1 id="battle-name">OTTOMAN BATTLE</h1></div><div class="hud"><div><span>WAVE</span><b id="wave">0/12</b></div><div><span>BASE</span><b id="lives">20</b></div><div><span>GOLD</span><b id="gold">0</b></div><div><span>MODE</span><b id="mode">RECRUIT</b></div></div><a id="quit" href="index.html?v=4&screen=maps">QUIT</a></header><section class="stage"><canvas id="battle" width="960" height="600"></canvas><div id="mission" class="mission">Loading battlefield…</div><div class="arsenal open"><button id="arsenal-toggle">ARSENAL⌄</button><div id="arsenal-list"></div></div><aside id="tower-panel"><button id="tower-close">×</button><div id="tower-info"></div><div id="upgrades"></div><button id="sell">SELL</button></aside><div class="commands"><button id="start-wave">START WAVE ▶</button></div><div id="result"><h2 id="result-title"></h2><p id="result-text"></p><a id="return-home" href="index.html?v=4&screen=maps">RETURN TO MAPS</a></div><div id="startup-error" style="display:none;position:absolute;inset:20% 15%;z-index:50;background:#160d0df2;border:2px solid #b88a45;border-radius:18px;padding:24px;color:#ffe9b0;font-family:Georgia,serif"><h2>BATTLE FAILED TO START</h2><p id="startup-error-text"></p><a href="index.html?v=4&screen=maps" style="display:inline-block;margin-top:12px;padding:10px 16px;background:#315e2f;border:1px solid #d3a34b;border-radius:10px;color:#fff0b0;text-decoration:none">RETURN TO MAPS</a></div></section></main><script>window.addEventListener('error',function(e){var box=document.getElementById('startup-error'),txt=document.getElementById('startup-error-text');if(box&&txt){txt.textContent=e.message||'Unknown startup error';box.style.display='block';}});window.addEventListener('unhandledrejection',function(e){var box=document.getElementById('startup-error'),txt=document.getElementById('startup-error-text');if(box&&txt){txt.textContent=(e.reason&&e.reason.message)||String(e.reason||'Unknown startup error');box.style.display='block';}});</script><script type="module" src="src/ottoman-battle.js?v=4"></script></body></html>
